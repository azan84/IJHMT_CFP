      <ns0:polygon points="77.7,118 79.7,122 75.7,122" fill="#ffffff" stroke="#009E73" stroke-width="0.8" />
      <ns0:polygon points="123.5,136 125.5,140 121.5,140" fill="#ffffff" stroke="#009E73" stroke-width="0.8" />
      <ns0:polygon points="169.2,145 171.2,149 167.2,149" fill="#ffffff" stroke="#009E73" stroke-width="0.8" />
      <ns0:polygon points="215,150 217,154 213,154" fill="#ffffff" stroke="#009E73" stroke-width="0.8" />
      <ns0:text x="170" y="148" font-size="5.5" font-weight="bold" fill="#009E73" font-family="Arial, Helvetica, sans-serif">OR 50%</ns0:text>

      
      <ns0:path d="M 32,120 Q 123.5,158 215,170" fill="none" stroke="#0072B2" stroke-width="1.3" />
      <ns0:polygon points="32,118 34,120 32,122 30,120" fill="#0072B2" />
      <ns0:polygon points="77.7,143 79.7,145 77.7,147 75.7,145" fill="#0072B2" />
      <ns0:polygon points="123.5,156 125.5,158 123.5,160 121.5,158" fill="#0072B2" />
      <ns0:polygon points="169.2,163 171.2,165 169.2,167 167.2,165" fill="#0072B2" />
      <ns0:polygon points="215,168 217,170 215,172 213,170" fill="#0072B2" />
      <ns0:text x="170" y="166" font-size="5.5" font-weight="bold" fill="#0072B2" font-family="Arial, Helvetica, sans-serif">OR 0% (Full Baffle)</ns0:text>

      
    
    <ns0:g transform="translate(45, 115)">
      <ns0:rect x="0" y="0" width="140" height="16" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
      <ns0:text x="70.0" y="10.0" font-size="5.8" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="0.2" font-family="Arial, Helvetica, sans-serif">PLACEHOLDER — MOCK DATA, NOT RESULTS</ns0:text>
    </ns0:g>

    </ns0:g>
    

    <ns0:g transform="translate(245, 20)">
      <ns0:rect x="0" y="0" width="135" height="215" fill="#ffffff" stroke="#000000" stroke-width="0.7" />
      <ns0:text x="6" y="11" font-size="6.8" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">(b) Global Scale Insights</ns0:text>

      <ns0:g transform="translate(5, 18)">
        <ns0:rect x="0" y="0" width="125" height="188" fill="#ffffff" stroke="#000000" stroke-width="0.5" />
        
        <ns0:text x="4" y="9" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Convective Starvation:</ns0:text>
        <ns0:text x="4" y="18" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• At identical pumping flow (Q),</ns0:text>
        <ns0:text x="4" y="27" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  unbaffled tank suffers up to</ns0:text>
        <ns0:text x="4" y="36" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">  2.2× higher R_th penalty</ns0:text>
        <ns0:text x="4" y="44" font-size="5.5" fill="#555555" font-family="Arial, Helvetica, sans-serif">  due to bypass diversion.</ns0:text>

        <ns0:line x1="4" y1="49" x2="121" y2="49" stroke="#cccccc" stroke-width="0.5" />

        <ns0:text x="4" y="58" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Apparent Non-Universality:</ns0:text>
        <ns0:text x="4" y="67" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Curves fan out widely across</ns0:text>
        <ns0:text x="4" y="76" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  blockage regimes when plotted</ns0:text>
        <ns0:text x="4" y="85" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  against Re_global.</ns0:text>
        <ns0:text x="4" y="93" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">→ Misleading design metric.</ns0:text>

        <ns0:line x1="4" y1="98" x2="121" y2="98" stroke="#cccccc" stroke-width="0.5" />

        <ns0:text x="4" y="108" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Channel Core Physics:</ns0:text>
        <ns0:text x="4" y="117" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• True convective resistance is</ns0:text>
        <ns0:text x="4" y="126" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  governed strictly by core flow</ns0:text>
        <ns0:text x="4" y="135" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">  ṁ_active = (1 - Φ_byp) · ṁ_tot</ns0:text>
        <ns0:text x="4" y="143" font-size="5.5" fill="#555555" font-family="Arial, Helvetica, sans-serif">  (Demonstrated in Fig. 9).</ns0:text>

        <ns0:line x1="4" y1="148" x2="121" y2="148" stroke="#cccccc" stroke-width="0.5" />

        <ns0:text x="4" y="158" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Cross-Reference:</ns0:text>
        <ns0:text x="4" y="167" font-size="5.5" fill="#333333" font-family="Arial, Helvetica, sans-serif">Manuscript §4.1 / Chun (2026)</ns0:text>
      </ns0:g>
    </ns0:g>
    
</ns0:svg>