      <ns0:line x1="169.2" y1="180" x2="169.2" y2="183" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="169.2" y="190" font-size="5.6" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1400</ns0:text>
      <ns0:line x1="215" y1="180" x2="215" y2="183" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="215" y="190" font-size="5.6" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1800</ns0:text>
