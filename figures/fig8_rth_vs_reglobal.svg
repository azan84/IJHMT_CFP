<ns0:text x="10" y="13" font-size="8.2" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Fig. 8. Thermal resistance (R_th) vs. global domain Reynolds number (Re_global).</ns0:text>

