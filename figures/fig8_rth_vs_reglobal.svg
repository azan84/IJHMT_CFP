      <ns0:path d="M 32,45 Q 123.5,85 215,108" fill="none" stroke="#D55E00" stroke-width="1.3" />
      <ns0:circle cx="32" cy="45" r="1.8" fill="#ffffff" stroke="#D55E00" stroke-width="0.9" />
      <ns0:circle cx="77.7" cy="65" r="1.8" fill="#ffffff" stroke="#D55E00" stroke-width="0.9" />
