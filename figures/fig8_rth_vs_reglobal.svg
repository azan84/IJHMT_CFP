      <ns0:rect x="30.5" y="68.5" width="3" height="3" fill="#ffffff" stroke="#E69F00" stroke-width="0.8" />
      <ns0:rect x="76.2" y="93.5" width="3" height="3" fill="#ffffff" stroke="#E69F00" stroke-width="0.8" />
      <ns0:rect x="122" y="113.5" width="3" height="3" fill="#ffffff" stroke="#E69F00" stroke-width="0.8" />
      <ns0:rect x="167.7" y="125.5" width="3" height="3" fill="#ffffff" stroke="#E69F00" stroke-width="0.8" />
