      <ns0:text x="170" y="130" font-size="5.5" font-weight="bold" fill="#E69F00" font-family="Arial, Helvetica, sans-serif">OR 100% (δ=2)</ns0:text>

      
      <ns0:path d="M 32,95 Q 123.5,138 215,152" fill="none" stroke="#009E73" stroke-width="1.1" stroke-dasharray="6,2,2,2" />
