<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="137.58mm" height="89.96mm" viewBox="0 0 390.00 255.00" font-family="Helvetica, Arial, sans-serif" style="background-color:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <ns0:defs>
    <ns0:style>
      text, tspan { font-family: Helvetica, Arial, "Nimbus Sans", sans-serif; }
    </ns0:style>
    
    <ns0:pattern id="hatch-active" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:line x1="2" y1="0" x2="2" y2="4" stroke="#000000" stroke-width="0.8" />
    </ns0:pattern>
    <ns0:pattern id="hatch-bypass" width="6" height="6" patternUnits="userSpaceOnUse">
      <ns0:path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke="#000000" stroke-width="0.8" />
    </ns0:pattern>
    <ns0:pattern id="hatch-block" width="5" height="5" patternUnits="userSpaceOnUse">
