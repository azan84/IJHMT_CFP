<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="137.58mm" height="86.43mm" viewBox="0 0 390.00 245.00" font-family="Helvetica, Arial, sans-serif" style="background-color:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <ns0:defs>
    <ns0:style>
      text, tspan { font-family: Helvetica, Arial, "Nimbus Sans", sans-serif; }
    </ns0:style>
    
    <ns0:pattern id="hatch-active" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:line x1="2" y1="0" x2="2" y2="4" stroke="#000000" stroke-width="0.8" />
    </ns0:pattern>
    <ns0:pattern id="hatch-bypass" width="6" height="6" patternUnits="userSpaceOnUse">
      <ns0:path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke="#000000" stroke-width="0.8" />
    </ns0:pattern>
    <ns0:pattern id="hatch-block" width="5" height="5" patternUnits="userSpaceOnUse">
      <ns0:path d="M0,0 l5,5 M5,0 l-5,5" stroke="#000000" stroke-width="0.6" />
    </ns0:pattern>
    <ns0:pattern id="hatch-tip" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:line x1="0" y1="2" x2="4" y2="2" stroke="#333333" stroke-width="0.7" stroke-dasharray="1.5,1.5" />
    </ns0:pattern>
    <ns0:pattern id="hatch-copper" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:path d="M0,4 L4,0" stroke="#333333" stroke-width="0.6" />
    </ns0:pattern>
    <ns0:pattern id="hatch-ram" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:line x1="2" y1="0" x2="2" y2="4" stroke="#555555" stroke-width="0.6" />
    </ns0:pattern>

    
    <ns0:marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </ns0:marker>
    <ns0:marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0072B2" />
    </ns0:marker>
    <ns0:marker id="arrow-bypass" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D55E00" />
    </ns0:marker>
    <ns0:marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="100%" height="100%" fill="#ffffff" />

<ns0:text x="10" y="13" font-size="8.2" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Fig. 9. Thermal resistance (R_th) vs. heat sink core Reynolds number (Re_hs).</ns0:text>

    <ns0:g transform="translate(10, 20)">
      <ns0:rect x="0" y="0" width="230" height="215" fill="#ffffff" stroke="#000000" stroke-width="0.7" />
      <ns0:text x="6" y="11" font-size="6.8" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">(a) R_th Collapse on Core Scale (Re_hs)</ns0:text>

      
      <ns0:line x1="32" y1="180" x2="215" y2="180" stroke="#000000" stroke-width="0.7" />
      <ns0:line x1="32" y1="180" x2="32" y2="28" stroke="#000000" stroke-width="0.7" />

      
      <ns0:line x1="32" y1="180" x2="32" y2="183" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="32" y="190" font-size="5.6" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">50</ns0:text>
      <ns0:line x1="77.7" y1="180" x2="77.7" y2="183" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="77.7" y="190" font-size="5.6" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">150</ns0:text>
      <ns0:line x1="123.5" y1="180" x2="123.5" y2="183" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="123.5" y="190" font-size="5.6" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">250</ns0:text>
      <ns0:line x1="169.2" y1="180" x2="169.2" y2="183" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="169.2" y="190" font-size="5.6" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">350</ns0:text>
      <ns0:line x1="215" y1="180" x2="215" y2="183" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="215" y="190" font-size="5.6" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">450</ns0:text>
      <ns0:text x="123.5" y="200" font-size="5.8" font-weight="bold" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Re_hs = (ρ·u_ch·D_h / μ) [-]</ns0:text>

      
      <ns0:line x1="29" y1="180" x2="32" y2="180" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="27" y="182" font-size="5.6" fill="#000000" text-anchor="end" font-family="Arial, Helvetica, sans-serif">0.04</ns0:text>
      <ns0:line x1="29" y1="142.5" x2="32" y2="142.5" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="27" y="144.5" font-size="5.6" fill="#000000" text-anchor="end" font-family="Arial, Helvetica, sans-serif">0.07</ns0:text>
      <ns0:line x1="29" y1="105" x2="32" y2="105" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="27" y="107" font-size="5.6" fill="#000000" text-anchor="end" font-family="Arial, Helvetica, sans-serif">0.10</ns0:text>
      <ns0:line x1="29" y1="67.5" x2="32" y2="67.5" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="27" y="69.5" font-size="5.6" fill="#000000" text-anchor="end" font-family="Arial, Helvetica, sans-serif">0.13</ns0:text>
      <ns0:line x1="29" y1="30" x2="32" y2="30" stroke="#000000" stroke-width="0.5" />
      <ns0:text x="27" y="32" font-size="5.6" fill="#000000" text-anchor="end" font-family="Arial, Helvetica, sans-serif">0.16</ns0:text>
      <ns0:text x="10" y="105" font-size="5.8" font-weight="bold" fill="#000000" text-anchor="middle" transform="rotate(-90 10 105)" font-family="Arial, Helvetica, sans-serif">R_th [K/W]</ns0:text>

      
      <ns0:line x1="32" y1="142.5" x2="215" y2="142.5" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="2,2" />
      <ns0:line x1="32" y1="105" x2="215" y2="105" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="2,2" />
      <ns0:line x1="32" y1="67.5" x2="215" y2="67.5" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="2,2" />
      <ns0:line x1="32" y1="30" x2="215" y2="30" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="2,2" />

      
      <ns0:path d="M 32,45 Q 123.5,147 215,170" fill="none" stroke="#0072B2" stroke-width="1.8" />
      <ns0:path d="M 32,44 Q 123.5,146 215,169" fill="none" stroke="#D55E00" stroke-width="0.9" stroke-dasharray="2,2" />
      <ns0:path d="M 32,46 Q 123.5,148 215,171" fill="none" stroke="#009E73" stroke-width="0.9" stroke-dasharray="4,2" />

      
      <ns0:circle cx="32" cy="45" r="1.8" fill="#0072B2" />
      <ns0:circle cx="77.7" cy="112" r="1.8" fill="#0072B2" />
      <ns0:circle cx="123.5" cy="147" r="1.8" fill="#0072B2" />
      <ns0:circle cx="169.2" cy="162" r="1.8" fill="#0072B2" />
      <ns0:circle cx="215" cy="170" r="1.8" fill="#0072B2" />

      <ns0:rect x="76.2" y="110.5" width="3" height="3" fill="none" stroke="#E69F00" stroke-width="0.8" />
      <ns0:polygon points="123.5,145 125.5,149 121.5,149" fill="none" stroke="#009E73" stroke-width="0.8" />

      <ns0:text x="135" y="132" font-size="5.8" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Unified Master Curve</ns0:text>
      <ns0:text x="135" y="140" font-size="5.5" font-style="italic" fill="#555555" font-family="Arial, Helvetica, sans-serif">(All OR &amp; δ collapse within ±3.8%)</ns0:text>

      
    
    <ns0:g transform="translate(45, 75)">
      <ns0:rect x="0" y="0" width="140" height="16" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
      <ns0:text x="70.0" y="10.0" font-size="5.8" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="0.2" font-family="Arial, Helvetica, sans-serif">PLACEHOLDER — MOCK DATA, NOT RESULTS</ns0:text>
    </ns0:g>

    </ns0:g>
    

    <ns0:g transform="translate(245, 20)">
      <ns0:rect x="0" y="0" width="135" height="215" fill="#ffffff" stroke="#000000" stroke-width="0.7" />
      <ns0:text x="6" y="11" font-size="6.8" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">(b) Universal Data Collapse</ns0:text>

      <ns0:g transform="translate(5, 18)">
        <ns0:rect x="0" y="0" width="125" height="188" fill="#ffffff" stroke="#000000" stroke-width="0.5" />
        
        <ns0:text x="4" y="9" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Complete Data Collapse:</ns0:text>
        <ns0:text x="4" y="18" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• All data points from OR=100%,</ns0:text>
        <ns0:text x="4" y="27" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  50%, and 0% across 3 gap widths</ns0:text>
        <ns0:text x="4" y="36" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">  collapse onto a single curve</ns0:text>
        <ns0:text x="4" y="44" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  when plotted vs. Re_hs.</ns0:text>

        <ns0:line x1="4" y1="49" x2="121" y2="49" stroke="#cccccc" stroke-width="0.5" />

        <ns0:text x="4" y="58" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Physical Proof:</ns0:text>
        <ns0:text x="4" y="67" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Confirms that lateral bypass</ns0:text>
        <ns0:text x="4" y="76" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  acts purely as a mass diverter</ns0:text>
        <ns0:text x="4" y="85" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">  without altering local Nu-Re.</ns0:text>

        <ns0:line x1="4" y1="90" x2="121" y2="90" stroke="#cccccc" stroke-width="0.5" />

        <ns0:text x="4" y="100" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Design Simplification:</ns0:text>
        <ns0:text x="4" y="109" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Heat sink design can decouple</ns0:text>
        <ns0:text x="4" y="118" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">  core optimization from chassis</ns0:text>
        <ns0:text x="4" y="126" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">  bypass flow ratio Φ_byp.</ns0:text>

        <ns0:line x1="4" y1="131" x2="121" y2="131" stroke="#cccccc" stroke-width="0.5" />

        <ns0:text x="4" y="141" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Validation Reference:</ns0:text>
        <ns0:text x="4" y="150" font-size="5.5" fill="#333333" font-family="Arial, Helvetica, sans-serif">Manuscript §4.2 / Table 2</ns0:text>
      </ns0:g>
    </ns0:g>
    
</ns0:svg>