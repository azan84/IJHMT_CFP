<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="137.58mm" height="72.32mm" viewBox="0 0 390.00 205.00" font-family="Helvetica, Arial, sans-serif" style="background-color:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <ns0:defs>
    <ns0:style>
      text, tspan { font-family: Helvetica, Arial, "Nimbus Sans", sans-serif; }
    </ns0:style>
    
    <ns0:pattern id="hatch-active" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:line x1="2" y1="0" x2="2" y2="4" stroke="#000000" stroke-width="0.8" />
    </ns0:pattern>
    <ns0:pattern id="hatch-bypass" width="6" height="6" patternUnits="userSpaceOnUse">
      <ns0:path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke="#000000" stroke-width="0.8" />
    </ns0:pattern>
    <ns0:pattern id="hatch-block" width="5" height="5" patternUnits="userSpaceOnUse">
      <ns0:path d="M0,0 l5,5 M5,0 l-5,5" stroke="#000000" stroke-width="0.6" />
    </ns0:pattern>
    <ns0:pattern id="hatch-tip" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:line x1="0" y1="2" x2="4" y2="2" stroke="#333333" stroke-width="0.7" stroke-dasharray="1.5,1.5" />
    </ns0:pattern>
    <ns0:pattern id="hatch-copper" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:path d="M0,4 L4,0" stroke="#333333" stroke-width="0.6" />
    </ns0:pattern>
    <ns0:pattern id="hatch-ram" width="4" height="4" patternUnits="userSpaceOnUse">
      <ns0:line x1="2" y1="0" x2="2" y2="4" stroke="#555555" stroke-width="0.6" />
    </ns0:pattern>

    
    <ns0:marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </ns0:marker>
    <ns0:marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0072B2" />
    </ns0:marker>
    <ns0:marker id="arrow-bypass" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D55E00" />
    </ns0:marker>
    <ns0:marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <ns0:path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="100%" height="100%" fill="#ffffff" />

<ns0:text x="10" y="13" font-size="8.2" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Fig. 6. Schematic flowpath topology across structural blockage regimes.</ns0:text>

    <ns0:g transform="translate(10, 20)">
      <ns0:rect x="0" y="0" width="118.0" height="180.0" fill="#ffffff" stroke="#000000" stroke-width="0.7" />
      <ns0:text x="6" y="11" font-size="6.0" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">(a) OR = 100% (Free bypass)</ns0:text>

      
      <ns0:rect x="14" y="18" width="90" height="110" fill="#ffffff" stroke="#000000" stroke-width="0.7" />

      
      <ns0:rect x="39" y="53" width="40" height="40" fill="#ffffff" stroke="#E69F00" stroke-width="0.8" />
      <ns0:text x="59" y="75" font-size="5.6" font-weight="bold" fill="#0072B2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Fin Core</ns0:text>

      
      <ns0:path d="M 59,128 L 59,93" fill="none" stroke="#0072B2" stroke-width="1.1" marker-end="url(#arrow-active)" />
      <ns0:path d="M 59,53 L 59,18" fill="none" stroke="#0072B2" stroke-width="1.1" marker-end="url(#arrow-active)" />

      
      <ns0:path d="M 54,128 Q 24,108 24,73 Q 24,38 45,18" fill="none" stroke="#D55E00" stroke-width="1.1" stroke-dasharray="3,1.5" marker-end="url(#arrow-bypass)" />
      <ns0:path d="M 64,128 Q 94,108 94,73 Q 94,38 73,18" fill="none" stroke="#D55E00" stroke-width="1.1" stroke-dasharray="3,1.5" marker-end="url(#arrow-bypass)" />

      
      <ns0:g transform="translate(4, 133)">
        <ns0:rect x="0" y="0" width="110" height="42" fill="#ffffff" stroke="#000000" stroke-width="0.5" />
        <ns0:text x="4" y="9" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Unbaffled State:</ns0:text>
        <ns0:text x="4" y="19" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Lateral gap: Free flow</ns0:text>
        <ns0:text x="4" y="28" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Bypass ratio: Φ_byp = 48–90%*</ns0:text>
        <ns0:text x="4" y="37" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Severe convective starvation</ns0:text>
      </ns0:g>
    </ns0:g>
    

    <ns0:g transform="translate(136, 20)">
      <ns0:rect x="0" y="0" width="118.0" height="180.0" fill="#ffffff" stroke="#000000" stroke-width="0.7" />
      <ns0:text x="6" y="11" font-size="6.0" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">(b) OR = 50% (Partial baffle)</ns0:text>

      
      <ns0:rect x="14" y="18" width="90" height="110" fill="#ffffff" stroke="#000000" stroke-width="0.7" />

      
      <ns0:rect x="14" y="63" width="12" height="20" fill="url(#hatch-block)" stroke="#000000" stroke-width="0.6" />
      <ns0:rect x="92" y="63" width="12" height="20" fill="url(#hatch-block)" stroke="#000000" stroke-width="0.6" />

      
      <ns0:rect x="39" y="53" width="40" height="40" fill="#ffffff" stroke="#E69F00" stroke-width="0.8" />
      <ns0:text x="59" y="75" font-size="5.6" font-weight="bold" fill="#0072B2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Fin Core</ns0:text>

      
      <ns0:path d="M 59,128 L 59,93" fill="none" stroke="#0072B2" stroke-width="1.3" marker-end="url(#arrow-active)" />
      <ns0:path d="M 59,53 L 59,18" fill="none" stroke="#0072B2" stroke-width="1.3" marker-end="url(#arrow-active)" />

      
      <ns0:path d="M 54,128 Q 30,108 30,73 Q 30,38 47,18" fill="none" stroke="#D55E00" stroke-width="1.0" stroke-dasharray="2.5,1.5" marker-end="url(#arrow-bypass)" />
      <ns0:path d="M 64,128 Q 88,108 88,73 Q 88,38 71,18" fill="none" stroke="#D55E00" stroke-width="1.0" stroke-dasharray="2.5,1.5" marker-end="url(#arrow-bypass)" />

      
      <ns0:g transform="translate(4, 133)">
        <ns0:rect x="0" y="0" width="110" height="42" fill="#ffffff" stroke="#000000" stroke-width="0.5" />
        <ns0:text x="4" y="9" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Partial Block State:</ns0:text>
        <ns0:text x="4" y="19" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Baffle: 50% swept area</ns0:text>
        <ns0:text x="4" y="28" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Bypass ratio: Φ_byp = 37–67%*</ns0:text>
        <ns0:text x="4" y="37" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Moderate flow recovery</ns0:text>
      </ns0:g>
    </ns0:g>
    

    <ns0:g transform="translate(262, 20)">
      <ns0:rect x="0" y="0" width="118.0" height="180.0" fill="#ffffff" stroke="#000000" stroke-width="0.7" />
      <ns0:text x="6" y="11" font-size="6.0" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">(c) OR = 0% (Full baffle)</ns0:text>

      
      <ns0:rect x="14" y="18" width="90" height="110" fill="#ffffff" stroke="#000000" stroke-width="0.7" />

      
      <ns0:rect x="14" y="53" width="25" height="40" fill="url(#hatch-block)" stroke="#000000" stroke-width="0.6" />
      <ns0:rect x="79" y="53" width="25" height="40" fill="url(#hatch-block)" stroke="#000000" stroke-width="0.6" />
      <ns0:text x="26.5" y="75" font-size="5.5" font-weight="bold" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Block</ns0:text>
      <ns0:text x="91.5" y="75" font-size="5.5" font-weight="bold" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Block</ns0:text>

      
      <ns0:rect x="39" y="53" width="40" height="40" fill="#ffffff" stroke="#E69F00" stroke-width="0.8" />
      <ns0:text x="59" y="75" font-size="5.6" font-weight="bold" fill="#0072B2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Fin Core</ns0:text>

      
      <ns0:path d="M 59,128 L 59,93" fill="none" stroke="#0072B2" stroke-width="1.6" marker-end="url(#arrow-active)" />
      <ns0:path d="M 48,128 L 48,93" fill="none" stroke="#0072B2" stroke-width="1.2" marker-end="url(#arrow-active)" />
      <ns0:path d="M 70,128 L 70,93" fill="none" stroke="#0072B2" stroke-width="1.2" marker-end="url(#arrow-active)" />
      <ns0:path d="M 59,53 L 59,18" fill="none" stroke="#0072B2" stroke-width="1.6" marker-end="url(#arrow-active)" />
      <ns0:path d="M 48,53 L 48,18" fill="none" stroke="#0072B2" stroke-width="1.2" marker-end="url(#arrow-active)" />
      <ns0:path d="M 70,53 L 70,18" fill="none" stroke="#0072B2" stroke-width="1.2" marker-end="url(#arrow-active)" />

      
      <ns0:g transform="translate(4, 133)">
        <ns0:rect x="0" y="0" width="110" height="42" fill="#ffffff" stroke="#000000" stroke-width="0.5" />
        <ns0:text x="4" y="9" font-size="5.6" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Full Baffle State:</ns0:text>
        <ns0:text x="4" y="19" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• 100% lateral block</ns0:text>
        <ns0:text x="4" y="28" font-size="5.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">• Bypass ratio: Φ_byp &lt; 0.8%*</ns0:text>
        <ns0:text x="4" y="37" font-size="5.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">• 100% active cooling core</ns0:text>
      </ns0:g>
    </ns0:g>
    
</ns0:svg>